<!doctype html>
<html>
  <head>
    <title>VS Code Shortcuts Demo</title>
  </head>
  <body>
    <!-- moving with alt -->
    <h1>this text should be above the comment</h1>

    <!-- commenting -->
    <p>This paragraph should be commented out</p>

    <!-- delete line with one command -->
    <h2>Second Heading</h2>

    <!-- select multiple line -->

    <p>hi this is test1</p>
    <p>hi this is 2</p>
    <p>hi this is 3</p>
    <p>hi this is 4</p>
    <p>hi this is 5</p>

    <!-- select all matches -->
    <ul>
      <li>Item</li>
      <li>Item</li>
      <li>Item</li>
      <li>Item</li>
    </ul>
    <h1>Hello World</h1>
    <p>Hello again</p>
    <span>Hello one more time</span>
    <div>Hello finally</div>
  </body>
</html>
